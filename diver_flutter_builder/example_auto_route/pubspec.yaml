name: diver_flutter_builder_auto_route_example
description: >-
  Example Flutter app that wires up auto_route routes and runs
  diver_flutter_builder to aggregate them into diver/app_urls.json.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  diver_flutter_annotation:
    git:
      url: https://github.com/Mikkelet/diver_flutter_annotation

dev_dependencies:
  build_runner: ^2.4.0
  auto_route_generator: ^10.5.0
  diver_flutter_builder:
    path: ../

flutter:
  uses-material-design: true
